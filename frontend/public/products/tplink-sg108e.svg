      <text x="268" y="22" fill="#cbd5e1" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">7</text>
    
      <rect x="294" y="0" width="32" height="34" rx="3" fill="#030712" stroke="#64748b" stroke-width="1.5" />
      <circle cx="310" cy="44" r="2.5" fill="#10b981" />
