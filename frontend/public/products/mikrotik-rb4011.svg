  <g stroke="#374151" stroke-width="2">
    <line x1="110" y1="260" x2="110" y2="285" /><line x1="126" y1="260" x2="126" y2="285" /><line x1="142" y1="260" x2="142" y2="285" /><line x1="158" y1="260" x2="158" y2="285" /><line x1="174" y1="260" x2="174" y2="285" /><line x1="190" y1="260" x2="190" y2="285" /><line x1="206" y1="260" x2="206" y2="285" /><line x1="222" y1="260" x2="222" y2="285" /><line x1="238" y1="260" x2="238" y2="285" /><line x1="254" y1="260" x2="254" y2="285" /><line x1="270" y1="260" x2="270" y2="285" /><line x1="286" y1="260" x2="286" y2="285" /><line x1="302" y1="260" x2="302" y2="285" /><line x1="318" y1="260" x2="318" y2="285" /><line x1="334" y1="260" x2="334" y2="285" /><line x1="350" y1="260" x2="350" y2="285" /><line x1="366" y1="260" x2="366" y2="285" /><line x1="382" y1="260" x2="382" y2="285" /><line x1="398" y1="260" x2="398" y2="285" /><line x1="414" y1="260" x2="414" y2="285" /><line x1="430" y1="260" x2="430" y2="285" /><line x1="446" y1="260" x2="446" y2="285" /><line x1="462" y1="260" x2="462" y2="285" /><line x1="478" y1="260" x2="478" y2="285" />
