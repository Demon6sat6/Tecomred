      <text x="96" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">4</text>
    
      <rect x="112" y="0" width="24" height="28" rx="2" fill="#030712" stroke="#4b5563" stroke-width="1" />
      <circle cx="124" cy="34" r="2" fill="#10b981" />
      <text x="124" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">5</text>
    
      <rect x="140" y="0" width="24" height="28" rx="2" fill="#030712" stroke="#4b5563" stroke-width="1" />
      <circle cx="152" cy="34" r="2" fill="#10b981" />
      <text x="152" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">6</text>
    
      <rect x="168" y="0" width="24" height="28" rx="2" fill="#030712" stroke="#4b5563" stroke-width="1" />
      <circle cx="180" cy="34" r="2" fill="#10b981" />
      <text x="180" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">7</text>
    
      <rect x="196" y="0" width="24" height="28" rx="2" fill="#030712" stroke="#4b5563" stroke-width="1" />
      <circle cx="208" cy="34" r="2" fill="#10b981" />
      <text x="208" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">8</text>
    
      <rect x="224" y="0" width="24" height="28" rx="2" fill="#030712" stroke="#4b5563" stroke-width="1" />
      <circle cx="236" cy="34" r="2" fill="#10b981" />
      <text x="236" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">9</text>
    
      <rect x="252" y="0" width="24" height="28" rx="2" fill="#030712" stroke="#4b5563" stroke-width="1" />
      <circle cx="264" cy="34" r="2" fill="#10b981" />
      <text x="264" y="20" fill="#9ca3af" font-family="system-ui" font-size="9" text-anchor="middle">10</text>
    
  </g>

  <!-- 10G SFP+ Cage -->
  <g transform="translate(420, 195)">
    <rect x="0" y="0" width="48" height="34" rx="3" fill="#030712" stroke="#ef4444" stroke-width="1.5" />
    <text x="24" y="22" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">10G SFP+</text>
    <circle cx="24" cy="42" r="2.5" fill="#ef4444" filter="url(#glow)" />
  </g>

