<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="300" cy="205" r="180" fill="url(#cardGlow)" />
  
  <!-- Subtle technical grid background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="600" y2="0" /><line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="100" x2="600" y2="100" /><line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="300" x2="600" y2="300" /><line x1="0" y1="350" x2="600" y2="350" /><line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="0" x2="0" y2="450" /><line x1="50" y1="0" x2="50" y2="450" /><line x1="100" y1="0" x2="100" y2="450" /><line x1="150" y1="0" x2="150" y2="450" /><line x1="200" y1="0" x2="200" y2="450" /><line x1="250" y1="0" x2="250" y2="450" /><line x1="300" y1="0" x2="300" y2="450" /><line x1="350" y1="0" x2="350" y2="450" /><line x1="400" y1="0" x2="400" y2="450" /><line x1="450" y1="0" x2="450" y2="450" /><line x1="500" y1="0" x2="500" y2="450" /><line x1="550" y1="0" x2="550" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>
  
  <!-- Tool Case Base -->
  <rect x="100" y="100" width="400" height="260" rx="16" fill="#0f172a" stroke="#334155" stroke-width="3" />
  
  <!-- Heavy Duty Crimper Tool -->
  <path d="M140 130 L220 250 L200 320" stroke="#ef4444" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M220 250 L280 320" stroke="#ef4444" stroke-width="18" stroke-linecap="round" fill="none" />
  <rect x="130" y="120" width="60" height="50" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <circle cx="160" cy="145" r="8" fill="#0f172a" />

  <!-- Cable Tester Unit -->
  <rect x="320" y="140" width="90" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="335" y="155" width="60" height="30" rx="3" fill="#020617" />
  <text x="365" y="174" fill="#38bdf8" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">TESTER</text>
  
  <!-- LED sequence lights on tester -->
  <g transform="translate(345, 195)">
    
      <circle cx="10" cy="0" r="3" fill="#10b981" />
      <text x="25" y="3" fill="#94a3b8" font-family="monospace" font-size="8">1</text>
    
      <circle cx="10" cy="11" r="3" fill="#10b981" />
      <text x="25" y="14" fill="#94a3b8" font-family="monospace" font-size="8">2</text>
    
      <circle cx="10" cy="22" r="3" fill="#10b981" />
      <text x="25" y="25" fill="#94a3b8" font-family="monospace" font-size="8">3</text>
    
      <circle cx="10" cy="33" r="3" fill="#10b981" />
      <text x="25" y="36" fill="#94a3b8" font-family="monospace" font-size="8">4</text>
    
      <circle cx="10" cy="44" r="3" fill="#64748b" />
      <text x="25" y="47" fill="#94a3b8" font-family="monospace" font-size="8">5</text>
    
      <circle cx="10" cy="55" r="3" fill="#64748b" />
      <text x="25" y="58" fill="#94a3b8" font-family="monospace" font-size="8">6</text>
    
      <circle cx="10" cy="66" r="3" fill="#64748b" />
      <text x="25" y="69" fill="#94a3b8" font-family="monospace" font-size="8">7</text>
    
      <circle cx="10" cy="77" r="3" fill="#64748b" />
      <text x="25" y="80" fill="#94a3b8" font-family="monospace" font-size="8">8</text>
    
  </g>

  <!-- Wire Stripper -->
  <rect x="230" y="140" width="60" height="40" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
  <circle cx="260" cy="160" r="10" fill="#0f172a" />

  <!-- Badge -->
  <rect x="180" y="380" width="240" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="403" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Crimpadora + Tester + Pelacables</text>

</svg>