<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="300" cy="205" r="180" fill="url(#cardGlow)" />
  
  <!-- Subtle technical grid background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="600" y2="0" /><line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="100" x2="600" y2="100" /><line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="300" x2="600" y2="300" /><line x1="0" y1="350" x2="600" y2="350" /><line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="0" x2="0" y2="450" /><line x1="50" y1="0" x2="50" y2="450" /><line x1="100" y1="0" x2="100" y2="450" /><line x1="150" y1="0" x2="150" y2="450" /><line x1="200" y1="0" x2="200" y2="450" /><line x1="250" y1="0" x2="250" y2="450" /><line x1="300" y1="0" x2="300" y2="450" /><line x1="350" y1="0" x2="350" y2="450" /><line x1="400" y1="0" x2="400" y2="450" /><line x1="450" y1="0" x2="450" y2="450" /><line x1="500" y1="0" x2="500" y2="450" /><line x1="550" y1="0" x2="550" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>
  
  <!-- PCIe PCB -->
  <rect x="130" y="130" width="340" height="190" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Metal Bracket -->
  <rect x="95" y="80" width="35" height="260" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2" />
  <!-- RJ45 10G ports on bracket -->
  <rect x="100" y="140" width="25" height="32" rx="2" fill="#020617" stroke="#334155" />
  <circle cx="120" cy="135" r="2.5" fill="#10b981" filter="url(#glow)" />
  <rect x="100" y="185" width="25" height="32" rx="2" fill="#020617" stroke="#334155" />
  <circle cx="120" cy="180" r="2.5" fill="#10b981" filter="url(#glow)" />

  <!-- Black Heatsink over Controller -->
  <rect x="230" y="155" width="130" height="120" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <!-- Heatsink fins -->
  <g stroke="#334155" stroke-width="3">
    <line x1="242" y1="165" x2="242" y2="265" /><line x1="255" y1="165" x2="255" y2="265" /><line x1="268" y1="165" x2="268" y2="265" /><line x1="281" y1="165" x2="281" y2="265" /><line x1="294" y1="165" x2="294" y2="265" /><line x1="307" y1="165" x2="307" y2="265" /><line x1="320" y1="165" x2="320" y2="265" /><line x1="333" y1="165" x2="333" y2="265" /><line x1="346" y1="165" x2="346" y2="265" />
  </g>
  <text x="295" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">intel</text>
  <text x="295" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">10GbE</text>

  <!-- PCIe x4 Gold edge -->
  <g fill="#f59e0b" transform="translate(160, 320)">
    <rect x="0" y="0" width="3.5" height="20" rx="1" /><rect x="6" y="0" width="3.5" height="20" rx="1" /><rect x="12" y="0" width="3.5" height="20" rx="1" /><rect x="18" y="0" width="3.5" height="20" rx="1" /><rect x="24" y="0" width="3.5" height="20" rx="1" /><rect x="30" y="0" width="3.5" height="20" rx="1" /><rect x="36" y="0" width="3.5" height="20" rx="1" /><rect x="42" y="0" width="3.5" height="20" rx="1" /><rect x="48" y="0" width="3.5" height="20" rx="1" /><rect x="54" y="0" width="3.5" height="20" rx="1" /><rect x="60" y="0" width="3.5" height="20" rx="1" /><rect x="66" y="0" width="3.5" height="20" rx="1" /><rect x="72" y="0" width="3.5" height="20" rx="1" /><rect x="78" y="0" width="3.5" height="20" rx="1" /><rect x="84" y="0" width="3.5" height="20" rx="1" /><rect x="90" y="0" width="3.5" height="20" rx="1" /><rect x="96" y="0" width="3.5" height="20" rx="1" /><rect x="102" y="0" width="3.5" height="20" rx="1" /><rect x="108" y="0" width="3.5" height="20" rx="1" /><rect x="114" y="0" width="3.5" height="20" rx="1" /><rect x="120" y="0" width="3.5" height="20" rx="1" /><rect x="126" y="0" width="3.5" height="20" rx="1" /><rect x="132" y="0" width="3.5" height="20" rx="1" /><rect x="138" y="0" width="3.5" height="20" rx="1" /><rect x="144" y="0" width="3.5" height="20" rx="1" /><rect x="150" y="0" width="3.5" height="20" rx="1" /><rect x="156" y="0" width="3.5" height="20" rx="1" /><rect x="162" y="0" width="3.5" height="20" rx="1" /><rect x="168" y="0" width="3.5" height="20" rx="1" /><rect x="174" y="0" width="3.5" height="20" rx="1" /><rect x="180" y="0" width="3.5" height="20" rx="1" /><rect x="186" y="0" width="3.5" height="20" rx="1" />
  </g>

  <!-- Badge -->
  <rect x="180" y="370" width="240" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="393" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Dual Port 10GbE | PCIe 3.0</text>

</svg>