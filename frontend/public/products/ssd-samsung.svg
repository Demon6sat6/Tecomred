<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="300" cy="205" r="180" fill="url(#cardGlow)" />
  
  <!-- Subtle technical grid background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="600" y2="0" /><line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="100" x2="600" y2="100" /><line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="300" x2="600" y2="300" /><line x1="0" y1="350" x2="600" y2="350" /><line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="0" x2="0" y2="450" /><line x1="50" y1="0" x2="50" y2="450" /><line x1="100" y1="0" x2="100" y2="450" /><line x1="150" y1="0" x2="150" y2="450" /><line x1="200" y1="0" x2="200" y2="450" /><line x1="250" y1="0" x2="250" y2="450" /><line x1="300" y1="0" x2="300" y2="450" /><line x1="350" y1="0" x2="350" y2="450" /><line x1="400" y1="0" x2="400" y2="450" /><line x1="450" y1="0" x2="450" y2="450" /><line x1="500" y1="0" x2="500" y2="450" /><line x1="550" y1="0" x2="550" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>
  
  <!-- M.2 PCB -->
  <rect x="90" y="160" width="420" height="130" rx="8" fill="#044e36" stroke="#059669" stroke-width="2.5" />
  
  <!-- Mount screw notch -->
  <circle cx="90" cy="225" r="10" fill="#050811" stroke="#059669" stroke-width="2" />
  <circle cx="90" cy="225" r="5" fill="#050811" />

  <!-- Gold M-Key pins -->
  <g fill="#f59e0b" transform="translate(480, 170)">
    <rect x="0" y="0" width="1.5" height="24" /><rect x="2" y="0" width="1.5" height="24" /><rect x="4" y="0" width="1.5" height="24" /><rect x="6" y="0" width="1.5" height="24" /><rect x="8" y="0" width="1.5" height="24" /><rect x="10" y="0" width="1.5" height="24" /><rect x="12" y="0" width="1.5" height="24" /><rect x="14" y="0" width="1.5" height="24" /><rect x="16" y="0" width="1.5" height="24" /><rect x="18" y="0" width="1.5" height="24" /><rect x="20" y="0" width="1.5" height="24" /><rect x="22" y="0" width="1.5" height="24" /><rect x="24" y="0" width="1.5" height="24" /><rect x="26" y="0" width="1.5" height="24" />
    <rect x="9" y="0" width="4" height="24" fill="#044e36" />
    <rect x="0" y="85" width="1.5" height="24" /><rect x="2" y="85" width="1.5" height="24" /><rect x="4" y="85" width="1.5" height="24" /><rect x="6" y="85" width="1.5" height="24" /><rect x="8" y="85" width="1.5" height="24" /><rect x="10" y="85" width="1.5" height="24" /><rect x="12" y="85" width="1.5" height="24" /><rect x="14" y="85" width="1.5" height="24" /><rect x="16" y="85" width="1.5" height="24" /><rect x="18" y="85" width="1.5" height="24" /><rect x="20" y="85" width="1.5" height="24" /><rect x="22" y="85" width="1.5" height="24" /><rect x="24" y="85" width="1.5" height="24" /><rect x="26" y="85" width="1.5" height="24" />
  </g>

  <!-- Black Heat Label -->
  <rect x="130" y="175" width="330" height="100" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  
  <text x="150" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18">SAMSUNG</text>
  <text x="250" y="210" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="800" font-size="14">V-NAND SSD</text>
  <text x="150" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="20">970 EVO Plus</text>
  <text x="320" y="240" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="22">1TB</text>
  <text x="150" y="260" fill="#94a3b8" font-family="monospace" font-size="11">NVMe M.2 2280 | PCIe Gen 3.0 x4</text>

  <!-- NAND Chips visible -->
  <rect x="375" y="185" width="70" height="80" rx="2" fill="#1e293b" stroke="#334155" />
  <circle cx="385" cy="195" r="2" fill="#64748b" />

  <!-- Badge -->
  <rect x="180" y="340" width="240" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="363" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Lectura 3500MB/s | NVMe 1TB</text>

</svg>