<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="300" cy="205" r="180" fill="url(#cardGlow)" />
  
  <!-- Subtle technical grid background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="600" y2="0" /><line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="100" x2="600" y2="100" /><line x1="0" y1="150" x2="600" y2="150" /><line x1="0" y1="200" x2="600" y2="200" /><line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="300" x2="600" y2="300" /><line x1="0" y1="350" x2="600" y2="350" /><line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="0" x2="0" y2="450" /><line x1="50" y1="0" x2="50" y2="450" /><line x1="100" y1="0" x2="100" y2="450" /><line x1="150" y1="0" x2="150" y2="450" /><line x1="200" y1="0" x2="200" y2="450" /><line x1="250" y1="0" x2="250" y2="450" /><line x1="300" y1="0" x2="300" y2="450" /><line x1="350" y1="0" x2="350" y2="450" /><line x1="400" y1="0" x2="400" y2="450" /><line x1="450" y1="0" x2="450" y2="450" /><line x1="500" y1="0" x2="500" y2="450" /><line x1="550" y1="0" x2="550" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>
  
  <!-- Metal Case -->
  <rect x="130" y="150" width="340" height="150" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  
  <text x="155" y="180" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="15" letter-spacing="1">EdgeRouter X</text>
  <text x="375" y="180" fill="#64748b" font-family="monospace" font-size="11">ER-X</text>

  <!-- 5 Gigabit Ports with PoE in/out -->
  <g transform="translate(155, 210)">
    
      <rect x="0" y="0" width="46" height="38" rx="3" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="23" cy="48" r="2.5" fill="#38bdf8" />
      <text x="23" y="18" fill="#cbd5e1" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">eth0</text>
      <text x="23" y="30" fill="#38bdf8" font-family="system-ui" font-size="8" text-anchor="middle">PoE In</text>
    
      <rect x="58" y="0" width="46" height="38" rx="3" fill="#020617" stroke="#475569" stroke-width="1.5" />
      <circle cx="81" cy="48" r="2.5" fill="#10b981" />
      <text x="81" y="18" fill="#cbd5e1" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">eth1</text>
      <text x="81" y="30" fill="#64748b" font-family="system-ui" font-size="8" text-anchor="middle">Data</text>
    
      <rect x="116" y="0" width="46" height="38" rx="3" fill="#020617" stroke="#475569" stroke-width="1.5" />
      <circle cx="139" cy="48" r="2.5" fill="#10b981" />
      <text x="139" y="18" fill="#cbd5e1" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">eth2</text>
      <text x="139" y="30" fill="#64748b" font-family="system-ui" font-size="8" text-anchor="middle">Data</text>
    
      <rect x="174" y="0" width="46" height="38" rx="3" fill="#020617" stroke="#475569" stroke-width="1.5" />
      <circle cx="197" cy="48" r="2.5" fill="#10b981" />
      <text x="197" y="18" fill="#cbd5e1" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">eth3</text>
      <text x="197" y="30" fill="#64748b" font-family="system-ui" font-size="8" text-anchor="middle">Data</text>
    
      <rect x="232" y="0" width="46" height="38" rx="3" fill="#020617" stroke="#10b981" stroke-width="1.5" />
      <circle cx="255" cy="48" r="2.5" fill="#10b981" />
      <text x="255" y="18" fill="#cbd5e1" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">eth4</text>
      <text x="255" y="30" fill="#10b981" font-family="system-ui" font-size="8" text-anchor="middle">PoE Out</text>
    
  </g>

  <!-- Badge -->
  <rect x="180" y="340" width="240" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="363" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">5x GbE | Dual-Core | EdgeOS</text>

</svg>